<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - Ticket Confirmation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .ticket-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .qr-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin: 20px 0;
        }

        .ticket-code {
            font-family: monospace;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px dashed rgba(56, 189, 248, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-home {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="ticket-card">
    <div class="text-success mb-2">
        <i class="bi bi-check-circle-fill fs-1"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">Booking Confirmed!</h3>
    <p class="text-muted small">Your ticket has been successfully generated.</p>

    <div class="qr-box">
        <img th:src="${qrCodeUrl}" alt="QR Code" class="img-fluid" style="width: 160px; height: 160px;">
    </div>

    <div class="mb-3">
        <span class="ticket-code" th:text="${ticket.ticketCode}">EVT-12345678</span>
    </div>

    <div class="text-start bg-slate-900 p-3 rounded-3 mb-3" style="background: #0f172a; border: 1px solid rgba(255,255,255,0.05);">
        <div class="text-muted small">Event Name</div>
        <div class="fw-bold text-white mb-2" th:text="${ticket.event.title}">Event Title</div>

        <div class="text-muted small">Date & Location</div>
        <div class="text-white small" th:text="${ticket.event.date + ' | ' + ticket.event.location}">Date & Location</div>
    </div>

    <a href="/" class="btn-home"><i class="bi bi-house me-2"></i>Back to Home</a>
</div>

</body>
</html>
