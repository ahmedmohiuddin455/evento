<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 0;
        }

        .dark-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 24px;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: #0f172a;
            border-color: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .btn-primary-custom {
            background-color: #0ea5e9;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #0284c7;
        }

        .table-dark-custom {
            --bs-table-bg: #1e293b;
            --bs-table-color: #f8fafc;
            --bs-table-border-color: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="/">
            <i class="bi bi-ticket-perforated-fill text-info"></i> Evento Admin
        </a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i> Home</a>
            <a href="/login" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <!-- Add Event Form -->
        <div class="col-lg-4">
            <div class="dark-card">
                <h4 class="fw-bold mb-3 text-white"><i class="bi bi-plus-circle text-info me-2"></i>Create New Event</h4>
                <form th:action="@{/admin/add-event}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Event Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Tech Conference 2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Short description..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date & Time</label>
                        <input type="text" name="date" class="form-control" placeholder="Oct 15, 2026 - 10:00 AM" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" placeholder="Dhaka, Bangladesh" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ticket Price ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control" placeholder="49.99" required>
                    </div>
                    <button type="submit" class="btn-primary-custom w-100">Add Event</button>
                </form>
            </div>
        </div>

        <!-- Manage Events Table -->
        <div class="col-lg-8">
            <div class="dark-card">
                <h4 class="fw-bold mb-3 text-white"><i class="bi bi-list-stars text-info me-2"></i>Active Events</h4>
                <div class="table-responsive">
                    <table class="table table-dark-custom align-middle m-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Price</th>
                            <th class="text-end">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.id}">1</td>
                            <td class="fw-bold" th:text="${event.title}">Sample Event</td>
                            <td th:text="${event.date}">Date</td>
                            <td class="text-info fw-bold" th:text="${'$' + event.price}">$0.00</td>
                            <td class="text-end">
                                <form th:action="@{/admin/delete-event}" method="post" class="d-inline">
                                    <input type="hidden" name="eventId" th:value="${event.id}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this event?')">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="5" class="text-center text-muted py-4">No events created yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
