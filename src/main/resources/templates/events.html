<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - Browse Events</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 0;
        }

        .feature-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-primary-custom {
            background-color: #0ea5e9;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .price-tag {
            color: #38bdf8;
            font-weight: 700;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="/">
            <i class="bi bi-ticket-perforated-fill text-info"></i> Evento
        </a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i> Home</a>
            <a href="/login" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-white m-0">Upcoming Events</h2>
            <p class="text-muted m-0">Select an event and book your ticket instantly.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="event : ${events}">
            <div class="feature-card d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h4 class="fw-bold text-white m-0" th:text="${event.title}">Event Title</h4>
                        <span class="price-tag" th:text="${'$' + (event.price != null ? event.price : '0.0')}">$0.00</span>
                    </div>
                    <p class="text-muted small mb-3" th:text="${event.description}">Description...</p>

                    <div class="text-slate-300 small mb-2" style="color: #cbd5e1;">
                        <i class="bi bi-calendar-event text-info me-2"></i><span th:text="${event.date}">Date</span>
                    </div>
                    <div class="text-slate-300 small mb-4" style="color: #cbd5e1;">
                        <i class="bi bi-geo-alt text-info me-2"></i><span th:text="${event.location}">Location</span>
                    </div>
                </div>

                <form th:action="@{/book-ticket}" method="post">
                    <input type="hidden" name="eventId" th:value="${event.id}">
                    <input type="hidden" name="userId" th:value="${userId}">
                    <button type="submit" class="btn-primary-custom d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-ticket-detailed-fill"></i> Book Ticket Now
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 text-center py-5 text-muted" th:if="${#lists.isEmpty(events)}">
            <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>
            No events available at the moment.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
