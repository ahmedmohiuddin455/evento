<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .auth-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            color: #cbd5e1;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .btn-primary-custom {
            background-color: #0ea5e9;
            color: #ffffff;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            border: none;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <a href="/" class="text-decoration-none text-white fs-3 fw-bold d-inline-flex align-items-center gap-2">
            <i class="bi bi-ticket-perforated-fill text-info"></i> Evento
        </a>
        <p class="text-muted small mt-1">Create a new account</p>
    </div>

    <!-- Duplicate Email Error Message -->
    <div th:if="${error}" class="alert alert-danger py-2 text-center fs-7 mb-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 8px;">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Select Role</label>
            <select name="role" class="form-select" required>
                <option value="USER" selected>User</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button type="submit" class="btn-primary-custom">Register</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted small">Already have an account? </span>
        <a href="/login" class="text-info small text-decoration-none fw-semibold">Login</a>
    </div>
</div>

</body>
</html>
